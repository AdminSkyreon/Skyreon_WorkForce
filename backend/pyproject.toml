[project]
name = "skyreon-workforce-api"
version = "0.1.0"
description = "Skyreon Workforce Portal API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "email-validator>=2.2.0",
  "pwdlib[argon2]>=0.2.1",
  "pyjwt>=2.10.1",
  "apscheduler>=3.11.0",
  "httpx>=0.28.1",
  "greenlet>=3.1.1",
  "reportlab>=4.2.5",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.6",
  "mypy>=1.14.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042", "UP046"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
